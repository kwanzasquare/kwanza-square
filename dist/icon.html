<meta charset="utf-8">
<title>Kwanza Square icon</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #stage {
    width: 1024px; height: 1024px;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
  }
  /* macOS icon grid: art fills ~80% of the canvas, squircle corners ~22% */
  #art {
    width: 820px; height: 820px;
    border-radius: 184px;
    overflow: hidden;
    background: #10306B;
    box-shadow: 0 18px 44px rgba(0,0,0,.35);
  }
  #art svg { display: block; width: 100%; height: 100%; }
</style>

<div id="stage"><div id="art"><svg id="emblem"></svg></div></div>

<script src="../js/geometry.js"></script>
<script src="../js/render.js"></script>
<script>
  var svg = document.getElementById('emblem');
  window.KZ.Render.emblem(svg);
  // The emblem's rounded ground and inner black frame fight the squircle clip,
  // so square off the ground and drop the frame — the wrapper defines the shape.
  var rects = svg.querySelectorAll(':scope > rect');
  rects[0].setAttribute('rx', 0);
  if (rects[1]) rects[1].remove();
</script>
